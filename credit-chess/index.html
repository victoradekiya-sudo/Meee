<title>Credit Chess</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: board as the banknote's centre, an account statement above and below it,
     the ledger and price quote in a side column that drops under the board on phones. */
  :root {
    --paper: #edf2ea;
    --surface: #f8faf5;
    --ink: #15241b;
    --muted: #5a6b60;
    --line: #c8d3c6;
    --accent: #2b6a4b;
    --gold: #a07419;
    --burn: #b23f2d;
    --earn: #1f7a49;
    --sq-light: #e3eadb;
    --sq-dark: #7f9c85;
    --sq-select: #d9b65a;
    --sq-last: #c7d79a;
    --sq-check: #e0816f;
    --piece-white: #fbfbf4;
    --piece-black: #142019;
    --piece-edge: #142019;
    --font-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0e1712; --surface: #15211a; --ink: #e2ebe2; --muted: #93a598; --line: #2b3b31;
      --accent: #74c497; --gold: #d8ad52; --burn: #ec8270; --earn: #79cf9c;
      --sq-light: #b4c4ad; --sq-dark: #567561; --sq-select: #d2ad4c; --sq-last: #a9bd72; --sq-check: #d66f5c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0e1712; --surface: #15211a; --ink: #e2ebe2; --muted: #93a598; --line: #2b3b31;
    --accent: #74c497; --gold: #d8ad52; --burn: #ec8270; --earn: #79cf9c;
    --sq-light: #b4c4ad; --sq-dark: #567561; --sq-select: #d2ad4c; --sq-last: #a9bd72; --sq-check: #d66f5c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.5 var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 40px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

  .app { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }

  .top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px;
         border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  .brand { min-width: 0; }
  h1 { font: 800 clamp(30px, 5vw, 44px)/1 var(--font-display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--accent); }
  .tag { margin: 6px 0 0; color: var(--muted); max-width: 52ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; font-weight: 500; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.warn { border-color: var(--burn); color: var(--burn); }

  .status { border: 1px solid var(--gold); background: var(--surface); border-radius: 8px; padding: 10px 14px;
            font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); flex: none; }

  .table { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 860px) { .table { grid-template-columns: minmax(0, 1fr); } .play { max-width: 560px; width: 100%; margin: 0 auto; } }
  .play { display: grid; gap: 12px; min-width: 0; }

  /* Account statements */
  .acct { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; padding: 10px 2px; }
  .acct-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--piece-edge); }
  .acct[data-color="w"] .swatch { background: var(--piece-white); }
  .acct[data-color="b"] .swatch { background: var(--piece-black); border-color: var(--muted); }
  .acct-name { font-weight: 600; }
  .chip { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; }
  .chip.turn { background: var(--accent); color: var(--surface); }
  .chip.check { background: var(--burn); color: var(--surface); }
  .bal { grid-row: span 2; text-align: right; line-height: 1; }
  .bal .figure { font: 800 clamp(28px, 4.4vw, 38px)/1 var(--font-display); font-variant-numeric: lining-nums tabular-nums; }
  .bal .unit { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .acct.low .bal .figure { color: var(--burn); }
  .meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
  .acct.low .meter span { background: var(--burn); }
  .acct-stats { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }

  /* Board */
  .board-wrap { position: relative; container-type: inline-size; }
  .board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); aspect-ratio: 1; max-width: 100%;
           border: 6px solid var(--ink); border-radius: 4px; box-shadow: 0 0 0 1px var(--gold), 0 0 0 7px var(--paper), 0 0 0 8px var(--gold); }
  .sq { position: relative; border: 0; padding: 0; display: grid; place-items: center; background: var(--sq-light); }
  .sq.dark { background: var(--sq-dark); }
  .sq.last { background: color-mix(in srgb, var(--sq-last) 70%, var(--sq-light)); }
  .sq.dark.last { background: color-mix(in srgb, var(--sq-last) 60%, var(--sq-dark)); }
  .sq.selected { background: var(--sq-select); }
  .sq.check { background: radial-gradient(circle, var(--sq-check) 30%, transparent 75%), var(--sq-light); }
  .sq.dark.check { background: radial-gradient(circle, var(--sq-check) 30%, transparent 75%), var(--sq-dark); }
  .piece { font-size: 9.6cqi; line-height: 1; font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", sans-serif;
           font-variant-emoji: text; pointer-events: none; user-select: none; }
  .piece.w { color: var(--piece-white); -webkit-text-stroke: .28cqi var(--piece-edge); paint-order: stroke fill; }
  .piece.b { color: var(--piece-black); -webkit-text-stroke: .12cqi var(--piece-black); }
  .coord { position: absolute; font: 500 2cqi/1 var(--font-num); color: var(--sq-dark); pointer-events: none; }
  .sq.dark .coord { color: var(--sq-light); }
  .coord.file { right: .6cqi; bottom: .5cqi; }
  .coord.rank { left: .6cqi; top: .5cqi; }

  .target::after { content: ""; position: absolute; width: 3.4cqi; height: 3.4cqi; border-radius: 50%; background: var(--ink); opacity: .35; }
  .target.capture::after { width: 10.6cqi; height: 10.6cqi; background: transparent; border: .7cqi solid var(--ink); opacity: .35; }
  .target.broke::after { background: transparent; border: .5cqi dashed var(--burn); opacity: .9; }
  .price { position: absolute; right: .4cqi; top: .4cqi; z-index: 1; font: 600 2.1cqi/1 var(--font-num); padding: .35cqi .55cqi;
           border-radius: .6cqi; background: var(--surface); color: var(--burn); pointer-events: none; }
  .price.up { color: var(--earn); }
  .target.broke .price { text-decoration: line-through; color: var(--muted); }
  .sq.hover { box-shadow: inset 0 0 0 .5cqi var(--gold); }

  .promo { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 55%, transparent); }
  .promo-card { background: var(--surface); border-radius: 8px; padding: 14px; display: grid; gap: 10px; text-align: center; }
  .promo-card p { margin: 0; font-weight: 600; }
  .promo-row { display: flex; gap: 8px; }
  .promo-row button { width: 15cqi; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 6px; background: var(--sq-light); display: grid; place-items: center; }
  .promo-row .piece { font-size: 10cqi; }

  /* Side column */
  .side { display: grid; gap: 22px; min-width: 0; }
  .panel h2 { font: 600 12px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

  .quote { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-height: 140px; }
  .quote-title { font: 600 20px/1.2 var(--font-display); margin: 0 0 8px; text-wrap: balance; }
  .quote p { margin: 0; color: var(--muted); }
  .bill { width: 100%; border-collapse: collapse; font-size: 14px; }
  .bill td { padding: 4px 0; border-bottom: 1px dotted var(--line); }
  .bill td:last-child { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
  .bill tr.total td { border-bottom: 0; border-top: 1.5px solid var(--ink); font-weight: 600; padding-top: 6px; }
  .bill tr.after td { border-bottom: 0; color: var(--muted); }
  .neg { color: var(--burn); }
  .pos { color: var(--earn); }

  .ledger-scroll { max-height: 300px; overflow: auto; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--line); }
  .ledger { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .ledger th { position: sticky; top: 0; background: var(--paper); text-align: right; font-weight: 600; font-size: 11px;
               letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 6px; }
  .ledger th:nth-child(-n+2) { text-align: left; }
  .ledger td { padding: 5px 6px; border-top: 1px solid var(--line); text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ledger td:nth-child(-n+2) { text-align: left; }
  .ledger td:nth-child(2) { font-family: var(--font-body); font-weight: 600; }
  .ledger .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--piece-edge); margin-right: 6px; vertical-align: 1px; }
  .ledger .dot.w { background: var(--piece-white); }
  .ledger .dot.b { background: var(--piece-black); border-color: var(--muted); }
  .ledger .empty td { text-align: left; color: var(--muted); font-family: var(--font-body); padding: 12px 6px; }

  .rules { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rules th, .rules td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); text-align: right; }
  .rules th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .rules th:first-child, .rules td:first-child { text-align: left; }
  .rules td { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .rules td:first-child { font-family: var(--font-body); font-weight: 500; }
  .rule-notes { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 6px; max-width: 65ch; }
  .rules-scroll { overflow-x: auto; }

  @media (prefers-reduced-motion: reduce) { .meter span { transition: none; } }
</style>

<main class="app">
  <header class="top">
    <div class="brand">
      <h1>Credit <em>Chess</em></h1>
      <p class="tag">Standard chess, but every move costs credits. Captures and checks pay you back. Run out of credits and you lose.</p>
    </div>
    <div class="actions" id="actions"></div>
  </header>

  <div class="status" id="status" role="status" hidden></div>

  <div class="table">
    <section class="play" aria-label="Game">
      <div class="acct" id="acct-top"></div>
      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Chess board"></div>
        <div class="promo" id="promo" hidden></div>
      </div>
      <div class="acct" id="acct-bottom"></div>
    </section>

    <aside class="side">
      <section class="panel">
        <h2>Price check</h2>
        <div class="quote" id="quote" aria-live="polite"></div>
      </section>
      <section class="panel">
        <h2>Ledger</h2>
        <div class="ledger-scroll" id="ledger-scroll">
          <table class="ledger">
            <thead><tr><th>#</th><th>Move</th><th>Fee</th><th>Earned</th><th>Balance</th></tr></thead>
            <tbody id="ledger"></tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <h2>Price list</h2>
        <div class="rules-scroll"><table class="rules" id="rules"></table></div>
        <ul class="rule-notes" id="rule-notes"></ul>
      </section>
    </aside>
  </div>
</main>

<script type="module" src="src/ui.js"></script>
